# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
# ⚠️ 本机代理（依赖下载走 Clash 之类）**不要写在这里** —— 这个文件会跟仓库一起发给别人，
# 而别人的网络不需要（也连不上）你本机的代理。放在**用户目录**那份里：
#   C:\Users\<你>\.gradle\gradle.properties
# 那里写的键会被 Gradle 自动合并进来，且不进任何仓库。
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1,1.22)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.251
# The Neo version range can use any version of Neo as bounds
neo_version_range=[21,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)
# Parchment 只用来在反编译源码里补参数名（调试可读性），但**版本必须与本项目的 MC 一致**，
# 且**必须是正式版**：SNAPSHOT 的 maven-metadata 有 TTL，过期后每次构建都要重新联网校验，
# 一旦 maven.neoforged.net 连不上（TLS handshake reset），整个构建直接失败 —— 代码一行没改也构建不了。
# 这里钉 1.21.1 的正式版 2024.11.17（= parchment-1.21.1 的 release，且已在本地 Gradle 缓存里）。
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
## Dependency versions
# Create (机械动力) - REQUIRED prerequisite of this addon. https://maven.createmod.net
# 6.0.10 is the current published 1.21.1 release players run; -280 is the maven build matching it
# (verified: create-1.21.1-6.0.10-280.jar's own neoforge.mods.toml declares version "6.0.10").
create_version=6.0.10-280
# Version range declared for the required "create" dependency in neoforge.mods.toml.
create_version_range=[6.0.10,)
# Compile-time companions bundled inside Create 6.0.10-280 as jar-in-jar (its
# META-INF/jarjar/metadata.json lists exactly these three). javac needs them to resolve the class
# hierarchy this addon compiles against; Create itself supplies them at runtime.
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6
## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=create_sequenced_mechanical_arm
# The human-readable display name for the mod.
# 中文名是「可编程动力臂」—— 跟着本体的用词走（本体 `sequenced_gearshift` 的中文就是「可编程齿轮箱」），
# 英文则跟着本体的英文体系：Sequenced。
mod_name=Create Sequenced Mechanical Arm
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
# 约定（详版见本机 PLAN 的「发布约定」）：
#   0.y.z = 还没定型（y 涨 = 加功能或不兼容；z 涨 = 只修 bug）；功能齐全后才上 1.0.0。
#   `+1.21.1` 是**构建元数据**：只标明"给哪个 MC 的"，不参与版本比较（Fabric API 也是这个写法）。
mod_version=0.2.0+1.21.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.github.Ling
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Ling
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Sequenced arm for Create: write a schedule-style program on an operation table, insert it into the arm, and the arm performs it step by step (take / deposit / unload / deploy / attack / mine / use / wait / send or receive a redstone link signal / call a subtask).
# 仓库地址：会填进 neoforge.mods.toml 的 displayURL / issueTrackerURL（mod 列表里能看到、点得开）。
mod_url=https://github.com/Ling-awa/CreateSmartMechanicalArm
